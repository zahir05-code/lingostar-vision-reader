<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="LingoStar 로고">
  <title>LingoStar logo</title>
  <desc>저시력 학생을 위한 영어 학습 도우미 — 별과 책을 결합한 마크, 굵은 산세리프 워드마크</desc>

  <!-- 배경 (투명 권장이지만 PNG export 시 가독성 확보용 화이트 사용 가능) -->
  <rect width="1200" height="360" fill="#0B1220"/>

  <!-- ===== 마크 ===== -->
  <g transform="translate(60,60)">
    <!-- 둥근 사각 배경 (고대비 노랑) -->
    <rect x="0" y="0" width="240" height="240" rx="56" fill="#FFD24A"/>

    <!-- 펼친 책 (저시력 친화: 굵은 외곽, 단순화) -->
    <g transform="translate(36,80)">
      <!-- 책 좌측 -->
      <path d="M 0,40
               Q 0,8 32,8
               L 80,8
               Q 84,8 84,12
               L 84,140
               Q 84,144 80,144
               L 32,144
               Q 0,144 0,112
               Z"
            fill="#0B1220" stroke="#0B1220" stroke-width="6" stroke-linejoin="round"/>
      <!-- 책 우측 -->
      <path d="M 168,40
               Q 168,8 136,8
               L 88,8
               Q 84,8 84,12
               L 84,140
               Q 84,144 88,144
               L 136,144
               Q 168,144 168,112
               Z"
            fill="#0B1220" stroke="#0B1220" stroke-width="6" stroke-linejoin="round"/>

      <!-- 책 위 글자 줄 (가독성 강조) -->
      <line x1="20" y1="48" x2="68" y2="48" stroke="#FFD24A" stroke-width="6" stroke-linecap="round"/>
      <line x1="20" y1="72" x2="68" y2="72" stroke="#FFD24A" stroke-width="6" stroke-linecap="round"/>
      <line x1="20" y1="96" x2="56" y2="96" stroke="#FFD24A" stroke-width="6" stroke-linecap="round"/>

      <line x1="100" y1="48" x2="148" y2="48" stroke="#FFD24A" stroke-width="6" stroke-linecap="round"/>
      <line x1="100" y1="72" x2="148" y2="72" stroke="#FFD24A" stroke-width="6" stroke-linecap="round"/>
      <line x1="100" y1="96" x2="136" y2="96" stroke="#FFD24A" stroke-width="6" stroke-linecap="round"/>
    </g>

    <!-- 별 (오른쪽 위, 학습의 '별') -->
    <g transform="translate(150,30) rotate(15)">
      <polygon points="40,0 50,28 80,28 56,46 65,75 40,58 15,75 24,46 0,28 30,28"
               fill="#7BD3FF" stroke="#0B1220" stroke-width="5" stroke-linejoin="round"/>
      <!-- 작은 반짝임 -->
      <circle cx="78" cy="-2" r="6" fill="#7BD3FF" stroke="#0B1220" stroke-width="4"/>
    </g>
  </g>

  <!-- ===== 워드마크 ===== -->
  <g transform="translate(340,0)">
    <!-- 굵고 단순한 산세리프 (저시력 가독성). 'Star' 음절은 액센트 컬러로. -->
    <text x="0" y="190"
          font-family="Arial Black, Helvetica, Apple SD Gothic Neo, sans-serif"
          font-size="170"
          font-weight="900"
          letter-spacing="-4"
          fill="#FFFFFF">Lingo<tspan fill="#FFD24A">Star</tspan></text>

    <!-- 태그라인 -->
    <text x="6" y="245"
          font-family="Arial, Helvetica, Apple SD Gothic Neo, sans-serif"
          font-size="28"
          font-weight="700"
          letter-spacing="2"
          fill="#A9B6D1">SEE · READ · GROW</text>
    <text x="6" y="288"
          font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif"
          font-size="26"
          font-weight="600"
          fill="#7BD3FF">저시력 학생을 위한 영어 학습 도우미</text>
  </g>
</svg>
